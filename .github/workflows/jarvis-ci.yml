name: JARVIS CI
on:
  push:
    paths: ["JARVIS_AI_BRAIN/**", ".github/workflows/jarvis-ci.yml"]
  pull_request:
    paths: ["JARVIS_AI_BRAIN/**", ".github/workflows/jarvis-ci.yml"]
jobs:
  release-gate:
    name: release gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: JARVIS_AI_BRAIN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx ruff
      # Frontend testlari bu yerda Playwright'siz SKIP bo'ladi — gate ularni majburiy qilmaydi (pastdagi job qiladi)
      - run: python scripts/release_gate.py --json-out release-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ matrix.os }}
          path: JARVIS_AI_BRAIN/release-report.json
          if-no-files-found: ignore

  frontend-gate:
    name: release gate + frontend e2e (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JARVIS_AI_BRAIN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements.txt httpx ruff playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/release_gate.py --require-frontend --json-out release-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-frontend
          path: JARVIS_AI_BRAIN/release-report.json
          if-no-files-found: ignore

  windows-installer:
    name: install.ps1 (real Windows)
    needs: release-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\JARVIS_AI_BRAIN\install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
      - name: Run installer (minimal, from this branch)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File JARVIS_AI_BRAIN\install.ps1 -Minimal -NoLaunch -InstallDir "$env:RUNNER_TEMP\jarvis" -Branch "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Start server and check it answers
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\jarvis"
          if (-not (Test-Path "$d\JARVIS.cmd")) { throw "launcher yo'q" }
          $p = Start-Process -FilePath "$d\.venv\Scripts\python.exe" -ArgumentList "-m","jarvis.api","--port","8765" -WorkingDirectory $d -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/auth/status; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "server javob bermadi" }
          if (-not $r.enabled -or $r.pin_set) { throw "kutilmagan auth holati: $($r | ConvertTo-Json)" }
          "Server OK: $($r | ConvertTo-Json -Compress)"
      - name: Re-run installer keeps data
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\jarvis"
          New-Item -ItemType Directory -Force "$d\data" | Out-Null
          Set-Content "$d\data\marker.txt" "saqlansin"
          powershell -ExecutionPolicy Bypass -File JARVIS_AI_BRAIN\install.ps1 -Minimal -NoLaunch -InstallDir $d -Branch "${{ github.ref_name }}"
          if ((Get-Content "$d\data\marker.txt") -ne "saqlansin") { throw "data o'chib ketdi" }
          if (Test-Path "$d\jarvis\jarvis") { throw "ichma-ich nusxa" }
          "Qayta o'rnatish OK"
      - name: Installer keeps local git history and approved local changes on update
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\jarvis"
          if (-not (Test-Path "$d\.git")) { throw ".git yaratilmadi" }
          git -C $d branch --list upstream | Out-Host
          if (-not (git -C $d branch --list upstream)) { throw "upstream branch yo'q" }
          # Tasdiqlangan mahalliy yaxshilanishni taqlid qilish
          Set-Content "$d\plugins\mahalliy.txt" "mening o'zgarishim"
          git -C $d add plugins/mahalliy.txt
          git -C $d -c user.name=t -c user.email=t@t commit -q -m "mahalliy taklif"
          & JARVIS_AI_BRAIN\install.ps1 -Minimal -NoLaunch -InstallDir $d -Branch "${{ github.ref_name }}"
          if (-not (Test-Path "$d\plugins\mahalliy.txt")) { throw "mahalliy o'zgarish yangilanishda o'chib ketdi" }
          if (git -C $d status --porcelain --untracked-files=no) { throw "ishchi papka toza emas" }
          git -C $d log --oneline -5 | Out-Host
          "Git yangilanish OK"
      - name: Installer repairs a broken .venv (interrupted install)
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\jarvis"
          Remove-Item -Recurse -Force "$d\.venv\Lib" -ErrorAction SilentlyContinue
          & JARVIS_AI_BRAIN\install.ps1 -Minimal -NoLaunch -InstallDir $d -Branch "${{ github.ref_name }}"
          & "$d\.venv\Scripts\python.exe" -c "import jarvis.core"
          if ($LASTEXITCODE -ne 0) { throw ".venv tiklanmadi" }
          "Buzuq .venv tiklandi OK"
      - name: Desktop launcher starts the windowless server (pythonw)
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\jarvis"
          cmd /c "$d\JARVIS.cmd"
          if ($LASTEXITCODE -ne 0) { Get-Content "$d\data\logs\server.log" -ErrorAction SilentlyContinue; throw "JARVIS.cmd server ishga tushmadi" }
          $r = Invoke-RestMethod http://127.0.0.1:8765/api/auth/status
          "pythonw server OK: $($r | ConvertTo-Json -Compress)"
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: JARVIS.exe is built and starts the server
        shell: powershell
        run: |
          $d = "$env:RUNNER_TEMP\jarvis"
          if (-not (Test-Path "$d\JARVIS.exe")) { throw "JARVIS.exe yaratilmadi" }
          $p = Start-Process "$d\JARVIS.exe" -ArgumentList "--no-browser" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$d\data\logs\server.log" -ErrorAction SilentlyContinue; throw "JARVIS.exe kodi $($p.ExitCode)" }
          $r = Invoke-RestMethod http://127.0.0.1:8765/api/auth/status
          "JARVIS.exe OK: $($r | ConvertTo-Json -Compress)"
          # Ikkinchi bosish: server ishlayapti — darhol qaytadi
          $p2 = Start-Process "$d\JARVIS.exe" -ArgumentList "--no-browser" -PassThru -Wait
          if ($p2.ExitCode -ne 0) { throw "ikkinchi ishga tushirish xato" }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
