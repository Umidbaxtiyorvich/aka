[pytest]
testpaths = tests
markers =
    unit: bitta modul mantiqi
    integration: bir nechta modul / tashqi vosita (ffmpeg, git, mock HTTP) bilan
    api: HTTP API orqali
    permissions: ruxsat, tasdiq, siyosat, sandbox, maxfiylik
    errors: xato holatlari va noto'g'ri kirishlar
    frontend: dashboard brauzerda (Playwright)
